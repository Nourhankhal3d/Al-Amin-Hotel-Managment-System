openapi: 3.0.3
info:
  title: Staff Management API (Receptionist)
  version: 1.0.0
  description: |
    API for the Receptionist screens of the hotel Staff Management System.
    Accounts, passwords, leave, shift schedules and payment verification belong to the Manager system (next sprint) and are NOT part of this API.

    ## How a shift works
    - Every receptionist has a default shift (`morning` 07:00-16:00, `evening` 16:00-23:00, `night` 23:00-07:00). The Manager system can add exceptions (cancel, swap, extra) for a given day.
    - Login finds today's shift and opens it. The client never sends `shift_id`, `staff_id` or any date/time: the server sets them.
    - Login is allowed from 30 minutes before the shift starts, but the session is **read-only** (`read_only: true`, `shift: null`) until the scheduled start. Any write in a read-only session returns `403 FORBIDDEN`.
    - Handover (`PATCH /shifts/current/handover`) closes the shift. After that every write returns `409 SHIFT_CLOSED`.
    - Once the next shift has opened, the previous shift's session becomes handover-only and writes return `409 SHIFT_HANDOVER_ONLY`.
    - One active session per account: a login from another device closes the older session.

    ## Time and money
    - Times are stored in UTC and returned as ISO 8601 with offset. Shift boundaries and `shift_date` use the `Africa/Cairo` time zone.
    - The hotel day runs from 12:00 to 12:00 (Cairo). Standard check-in and check-out time is 12:00.
    - All amounts are in Egyptian pounds (EGP), decimal numbers with two digits.
    - All totals (`total_amount`, `paid_amount`, `remaining_amount`) are calculated by the server. The client can never send prices or totals.

    ## Idempotency
    `POST /payments`, `POST /reservations`, `POST /reservations/{id}/check-in`, `/extend` and `/check-out` require an `Idempotency-Key` header (a random UUID generated by the frontend for each user action). If the same key is sent again with the same body, the server returns the original response and does not repeat the action (the response carries `Idempotent-Replayed: true`). The same key with a different body returns `400 VALIDATION_ERROR`.

    ## Lists
    List endpoints accept `page` (default 1) and `limit` (default 20, max 100) and return `{ "data": [...], "meta": { "page", "limit", "total" } }`.

    ## Errors
    Every error has the shape `{ "error": { "code": "...", "message": "..." } }`. The `code` values are listed in the `ErrorCode` schema.
servers:
  - url: /api/v1
    description: Base URL
tags:
  - name: Auth
  - name: Dashboard
  - name: Rooms
  - name: Guests
  - name: Reservations
  - name: Cleaning tasks
  - name: Maintenance issues
  - name: Payments
  - name: Shifts
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login and open today's shift
      description: |
        Verifies the credentials, finds the receptionist's shift for today and opens it (or resumes it).
        Returns a 15-minute access token in the body and sets the refresh token as an `httpOnly`, `Secure`, `SameSite=Strict` cookie.
        Before the scheduled start (up to 30 minutes early) the response has `shift: null` and `read_only: true`.
        A wrong username and a wrong password return the same 401 message. After 5 failed attempts the account is locked for 15 minutes, then 30, then 60 on repeats (429 with `Retry-After`). There is also a limit per IP address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: ahmed
              password: correct-horse-battery-staple
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie:
              description: Refresh token cookie (`httpOnly`, `Secure`, `SameSite=Strict`), replaced on every refresh.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                during_shift:
                  summary: Login during the shift
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIs...
                    expires_in: 900
                    staff:
                      staff_id: '1'
                      name: Ahmed
                      default_shift_type: morning
                    shift:
                      shift_id: '41'
                      staff_id: '1'
                      shift_date: '2026-10-08'
                      shift_type: morning
                      start_time: '07:00'
                      end_time: '16:00'
                      status: active
                      handed_over_at: null
                      shift_notes: null
                    read_only: false
                before_shift:
                  summary: Login 20 minutes before the shift starts
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIs...
                    expires_in: 900
                    staff:
                      staff_id: '1'
                      name: Ahmed
                      default_shift_type: morning
                    shift: null
                    read_only: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Not allowed to log in now.
            `OUTSIDE_SHIFT_HOURS`: more than 30 minutes before the shift, or after it ended with no active shift left to hand over.
            `NOT_SCHEDULED`: the day's schedule has no shift for this account (for example approved leave).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                outside:
                  value:
                    error:
                      code: OUTSIDE_SHIFT_HOURS
                      message: Login is not allowed outside your shift hours.
                not_scheduled:
                  value:
                    error:
                      code: NOT_SCHEDULED
                      message: You have no shift scheduled today.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Get a new access token
      description: |
        The frontend calls this silently in the background before the access token expires. It uses the refresh cookie (no body). The refresh token is replaced on every use. If an old refresh token is used again, the whole session is revoked. The refresh token expires one hour after the scheduled shift end so handover can finish.
        Because it uses a cookie, the server also checks the `Origin` header.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: New access token (a new refresh cookie is set)
          headers:
            Set-Cookie:
              description: New refresh token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in]
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                    description: Seconds until the access token expires.
                    example: 900
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the session
      description: |
        Invalidates the session on the server and clears the refresh cookie. The shift stays open: only handover closes it.
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current staff, shift and read-only flag
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                staff:
                  staff_id: '1'
                  name: Ahmed
                  default_shift_type: morning
                shift: null
                read_only: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Auth]
      operationId: updateMe
      summary: Update manager profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                full_name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  full_name:
                    type: string
                  phone:
                    type: string
                  email:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change staff password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        '204':
          description: Password changed successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/me/stats:
    get:
      tags: [Auth]
      operationId: getMeStats
      summary: Manager statistics
      responses:
        '200':
          description: Manager statistics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [audits_total, decisions_this_month, reports_pending_review]
                    properties:
                      audits_total:
                        type: integer
                      decisions_this_month:
                        type: integer
                      reports_pending_review:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/me/activities:
    get:
      tags: [Auth]
      operationId: getMeActivities
      summary: Manager activities
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        '200':
          description: Manager activities
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, action]
                  properties:
                    id:
                      type: string
                    action:
                      type: string
                    entity:
                      type: string
                      nullable: true
                    entity_id:
                      type: string
                      nullable: true
                    at:
                      type: string
                      format: date-time
                      nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/password-reset-requests:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Public request for password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        '202':
          description: Reset request accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Summary of the current shift
      description: Open cleaning tasks and maintenance issues from earlier shifts are included, so the next shift sees what is pending. `shift_payments_total` counts only the caller's current shift (zero in a read-only session).
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rooms:
    get:
      tags: [Rooms]
      operationId: listRooms
      summary: List all rooms
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RoomStatus'
        - name: room_type
          in: query
          schema:
            type: string
          example: double
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Rooms
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rooms/availability:
    get:
      tags: [Rooms]
      operationId: checkAvailability
      summary: Rooms available for a period
      description: Returns rooms with no overlapping reservation. The period is compared by date and time. Rooms that are in `maintenance` are not returned.
      parameters:
        - name: check_in
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: '2026-10-10T12:00:00+03:00'
        - name: check_out
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: '2026-10-13T12:00:00+03:00'
        - name: room_type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Available rooms
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rooms/{room_id}:
    get:
      tags: [Rooms]
      operationId: getRoom
      summary: Get one room
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /rooms/{room_id}/status:
    patch:
      tags: [Rooms]
      operationId: changeRoomStatus
      summary: Change a room's status
      description: |
        The receptionist can only set `available`, `cleaning` or `maintenance`. `reserved` and `occupied` are set by the server (booking, check-in, check-out), so the status never contradicts the bookings.

        | From | Receptionist may set | Set by the server |
        |---|---|---|
        | available | cleaning, maintenance | reserved (booking for the current stay day) |
        | reserved | none | occupied (check-in), available (cancel) |
        | occupied | none | cleaning (check-out) |
        | cleaning | available, maintenance | none |
        | maintenance | available, cleaning | none |

        Any other change returns `409 INVALID_STATUS_TRANSITION`. A room with a booking or a guest is not taken out of service by status: report a maintenance issue or move the reservation to another room.
        Each change writes a status history row with the time, status, notes and the current shift.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomStatusChange'
            example:
              status: maintenance
              notes: AC leaking
      responses:
        '200':
          description: Status changed. Returns the new history row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomStatusHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /rooms/{room_id}/status-history:
    get:
      tags: [Rooms]
      operationId: getRoomStatusHistory
      summary: Status log of a room, newest first
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoomStatusHistory'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /guests:
    post:
      tags: [Guests]
      operationId: createGuest
      summary: Add a guest
      description: The ID number is stored encrypted and is never returned in full. A guest with the same ID number already exists returns `409 CONFLICT` with the existing `guest_id` in the message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestCreate'
            example:
              name: John Smith
              phone: '+201001234567'
              id_number: '29801011234567'
      responses:
        '201':
          description: Guest created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Guests]
      operationId: searchGuests
      summary: Search guests
      description: At least one of `phone`, `name` or `id_number` is required. There is no way to list all guests without a search term. `id_number` is an exact match; `name` and `phone` match part of the value.
      parameters:
        - name: phone
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
        - name: id_number
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Matching guests
          content:
            application/json:
              schema:
                type: object
                required: [guests, page, limit, total]
                properties:
                  guests:
                    type: array
                    items:
                      $ref: '#/components/schemas/Guest'
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /guests/{guest_id}:
    get:
      tags: [Guests]
      operationId: getGuest
      summary: Get one guest
      parameters:
        - $ref: '#/components/parameters/GuestId'
      responses:
        '200':
          description: Guest (ID number masked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /reservations:
    post:
      tags: [Reservations]
      operationId: createReservation
      summary: Create a reservation
      description: |
        The reservation is `confirmed` from the moment it is created. The server calculates `total_amount` as number of nights x the room's `price_per_night`; the client cannot send it.
        Returns `409 CONFLICT` if the room is already booked for an overlapping period (compared by date and time).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
        - name: x-test-time
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreate'
            example:
              guest_id: '7'
              room_id: '101'
              check_in: '2026-10-10T12:00:00+03:00'
              check_out: '2026-10-13T12:00:00+03:00'
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Reservations]
      operationId: listReservations
      summary: List reservations
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReservationStatus'
        - name: room_id
          in: query
          schema:
            type: string
        - name: guest_id
          in: query
          schema:
            type: string
        - name: check_in_from
          in: query
          schema:
            type: string
            format: date-time
        - name: check_in_to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Reservations
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reservation'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /reservations/{reservation_id}:
    get:
      tags: [Reservations]
      operationId: getReservation
      summary: Get one reservation with guest, room and payments
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: Reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Reservations]
      operationId: updateReservation
      summary: Change the dates or the room
      description: |
        The server recalculates `total_amount` from the new number of nights. Fees already added (half-day extensions, early arrival) are kept. `paid_amount` is unchanged, so `remaining_amount` becomes the new total minus what the guest already paid.
        - Adding nights is allowed before and after check-in (a guest already in the hotel who wants another night gets a later `check_out`).
        - Removing nights: if the new `total_amount` would be less than `paid_amount`, the server returns `409 CONFLICT`. The manager refunds first (a reversing payment in the Manager system), then the change goes through.
        - Not allowed on `cancelled` or `checked_out` reservations.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationUpdate'
            example:
              check_out: '2026-10-15T12:00:00+03:00'
      responses:
        '200':
          description: Updated reservation with the new totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /reservations/{reservation_id}/cancel:
    post:
      tags: [Reservations]
      operationId: cancelReservation
      summary: Cancel a reservation
      description: |
        Only for `confirmed` reservations. A guest who is already checked in is checked out instead (409 `CONFLICT`).
        If nothing was paid (or everything was already refunded) the reservation is cancelled immediately and the response is `200`.
        If money was paid, the reservation is NOT cancelled: a `CANCELLATION` approval request is opened for the manager and the response is `202` with `status: PENDING_APPROVAL`. A second cancel while the approval is pending returns `409 CONFLICT`.
        Payments are never deleted. The room goes back to `available` when the cancellation is finally executed.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Reservation cancelled immediately (nothing was paid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '202':
          description: Money was paid. An approval request was opened for the manager
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [approval_id, status]
                    properties:
                      approval_id:
                        type: string
                      status:
                        type: string
                        enum: [PENDING_APPROVAL]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /approval-requests:
    post:
      tags: [Approvals]
      operationId: createApprovalRequest
      summary: Open an approval request for the manager
      description: |
        Types: `REFUND`, `DISCOUNT`, `CANCELLATION`, `UPGRADE`, `PRICE_OVERRIDE`. The reservation must be `confirmed` or `checked_in`.
        `requested_refund_amount` is allowed only for `REFUND` and `CANCELLATION` and must not exceed the net paid amount. `new_room_id` is required for `UPGRADE` and not allowed otherwise.
        Only one `PENDING` request per reservation and type. For the money types, nothing is paid out here: the manager decides in the Manager system.
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_type, booking_id, reason]
              properties:
                request_type:
                  type: string
                  enum: [REFUND, DISCOUNT, CANCELLATION, UPGRADE, PRICE_OVERRIDE]
                booking_id:
                  type: string
                reason:
                  type: string
                  maxLength: 500
                requested_refund_amount:
                  type: number
                new_room_id:
                  type: string
      responses:
        '201':
          description: Approval request created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ApprovalRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /reservations/{reservation_id}/check-in:
    post:
      tags: [Reservations]
      operationId: checkIn
      summary: Check the guest in
      description: |
        The receptionist verifies the guest's ID or passport manually before calling this. Everything below happens in one database transaction:
        1. Rejected with `409 PAYMENT_REQUIRED` unless at least one payment is recorded for the reservation.
        2. Sets `status=checked_in` and records the receptionist and the shift as the check-in staff and shift.
        3. Sets the room to `occupied` and writes a status history row.

        **Early arrival:** if the guest arrives before 12:00 on the check-in day and the room is already free (nobody in it, not being cleaned), send `{ "early_arrival": true }`. The server adds one `half_day_price` to `total_amount`, but only if the time is before 12:00 in Cairo and the room is free; otherwise it returns `409 CONFLICT`. The first-payment rule still applies, and the fee is included in `remaining_amount`.

        A guest who arrives at night (for example 3 AM) is checked in on the booking that started at 12:00 the day before, at no extra charge.
        The body is optional.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
            example:
              early_arrival: true
      responses:
        '200':
          description: Guest checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /reservations/{reservation_id}/extend:
    post:
      tags: [Reservations]
      operationId: extendStay
      summary: Add a half-day extension after the 12:00 check-out time
      description: |
        A guest who keeps the room one or two hours past 12:00 pays a half-day extension, whatever the number of hours. The server adds the room's `half_day_price` to `total_amount`, increases `half_day_extensions` by one and returns the new `remaining_amount`.
        - Only for a reservation that is `checked_in`.
        - Can be repeated: each call adds another `half_day_price`.
        - Returns `409 CONFLICT` if another booking for the same room starts that day.
        - Nothing is charged automatically: the receptionist records the extension before check-out.
        - It goes into the audit log and the shift report.
        There is no body.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      responses:
        '200':
          description: Extension added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
              example:
                reservation_id: '55'
                guest_id: '7'
                room_id: '101'
                check_in: '2026-10-10T12:00:00+03:00'
                check_out: '2026-10-13T12:00:00+03:00'
                status: checked_in
                early_arrival: false
                half_day_extensions: 1
                total_amount: 5000.00
                paid_amount: 4500.00
                remaining_amount: 500.00
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /reservations/{reservation_id}/check-out:
    post:
      tags: [Reservations]
      operationId: checkOut
      summary: Check the guest out
      description: |
        Blocked with `409 BALANCE_DUE` while `remaining_amount` is above zero. Otherwise, in one database transaction: sets `status=checked_out`, records the check-out staff and shift, sets the room to `cleaning`, writes a status history row and automatically creates a cleaning task (`pending`, priority `medium`, no `cleaner_name`). There is no body.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      responses:
        '200':
          description: Guest checked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /reservations/{reservation_id}/payments:
    get:
      tags: [Reservations, Payments]
      operationId: listReservationPayments
      summary: Payments of one reservation, from any shift
      description: The guest may pay a deposit in one shift and check out in another, so every receptionist can see all payments of a reservation.
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: Payments with the current totals
          content:
            application/json:
              schema:
                type: object
                required: [data, total_amount, paid_amount, remaining_amount]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  total_amount:
                    $ref: '#/components/schemas/Money'
                  paid_amount:
                    $ref: '#/components/schemas/Money'
                  remaining_amount:
                    $ref: '#/components/schemas/Money'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /cleaning-tasks:
    post:
      tags: [Cleaning tasks]
      operationId: createCleaningTask
      summary: Record a room that needs cleaning
      description: The receptionist assigns the cleaner because housekeeping has no system access, so `cleaner_name` is free text. The server sets `status=pending`, `assigned_date`, the shift and the staff member.
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleaningTaskCreate'
            example:
              room_id: '205'
              cleaner_name: Mona
              priority: high
              notes: Guest checked out
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleaningTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Cleaning tasks]
      operationId: listCleaningTasks
      summary: List cleaning tasks
      description: Includes open tasks from earlier shifts.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CleaningTaskStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/Priority'
        - name: room_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      responses:
        '200':
          description: Cleaning tasks
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CleaningTask'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /cleaning-tasks/{task_id}:
    get:
      tags: [Cleaning tasks]
      operationId: getCleaningTask
      summary: Get one cleaning task
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleaningTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Cleaning tasks]
      operationId: updateCleaningTask
      summary: Assign a cleaner, change priority or notes, or mark done
      description: Setting `status` to `done` makes the server fill `finished_date`. A task created at check-out has no cleaner name and shows as pending until one is assigned. A `done` task cannot go back to `pending`.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleaningTaskUpdate'
            example:
              cleaner_name: Mona
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleaningTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /maintenance-issues:
    post:
      tags: [Maintenance issues]
      operationId: createMaintenanceIssue
      summary: Report a maintenance problem
      description: The server sets `status=open`, `created_date`, the shift and the reporting staff member.
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceIssueCreate'
            example:
              room_id: '205'
              problem: Water leak
              priority: urgent
              notes: Bathroom ceiling
      responses:
        '201':
          description: Issue created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceIssue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Maintenance issues]
      operationId: listMaintenanceIssues
      summary: List maintenance issues
      description: Includes open issues from earlier shifts.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MaintenanceIssueStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/Priority'
        - name: room_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      responses:
        '200':
          description: Issues
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaintenanceIssue'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /maintenance-issues/{issue_id}:
    get:
      tags: [Maintenance issues]
      operationId: getMaintenanceIssue
      summary: Get one issue
      parameters:
        - $ref: '#/components/parameters/IssueId'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      responses:
        '200':
          description: Issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceIssue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Maintenance issues]
      operationId: updateMaintenanceIssue
      summary: Update an issue or mark it resolved
      description: |
        Resolving is a PATCH with `{ "status": "resolved" }`. The server fills `resolved_date`. A `resolved` issue cannot be reopened by the receptionist.
      parameters:
        - $ref: '#/components/parameters/IssueId'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceIssueUpdate'
            example:
              status: resolved
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceIssue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /payments:
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Record a payment
      description: |
        Send `reservation_id` (preferred, picked from a search by guest name, phone or room) or `room_id`. If only `room_id` is sent, the server uses the room's checked-in reservation, otherwise the confirmed reservation of the current stay day (12:00 to 12:00, Cairo time). If more than one matches it returns `409 AMBIGUOUS_RESERVATION` and the client must send `reservation_id`.

        Payments are accepted before check-in (the first payment is what allows check-in). The server sets `staff_id`, `shift_id` and `payment_datetime` itself.

        `amount` must be greater than zero and less than or equal to the reservation's current `remaining_amount` (paying everything at once is allowed). Otherwise the server returns `400 VALIDATION_ERROR` with a clear message.

        Payments are append-only: there is no update or delete. A mistake is corrected from the Manager system with a reversing record, and `payment_verified` is set only there.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
            examples:
              by_reservation:
                summary: Deposit for a reservation
                value:
                  reservation_id: '55'
                  amount: 1500.00
                  payment_method: cash
                  notes: Deposit
              by_room:
                summary: Payment by room number
                value:
                  room_id: '101'
                  amount: 3000.00
                  payment_method: instapay
      responses:
        '201':
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
              example:
                payment:
                  payment_id: '900'
                  reservation_id: '55'
                  staff_id: '1'
                  shift_id: '41'
                  amount: 1500.00
                  payment_method: cash
                  notes: Deposit
                  payment_datetime: '2026-10-08T14:30:00+03:00'
                  payment_verified: false
                  reversal_of_payment_id: null
                paid_amount: 1500.00
                remaining_amount: 3000.00
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Payments]
      operationId: listShiftPayments
      summary: Payments of the caller's current shift
      description: Always limited to the caller's current shift. There are no filters by staff or shift here; those belong to the Manager system.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Payments of the current shift
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /shifts/current:
    get:
      tags: [Shifts]
      operationId: getCurrentShift
      summary: The caller's active shift
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      responses:
        '200':
          description: Active shift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No active shift (read-only session before the start)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NOT_FOUND
                  message: No active shift.
  /shifts/current/summary:
    get:
      tags: [Shifts]
      operationId: getShiftSummary
      summary: Live summary before handover
      description: |
        Rooms handled, payments (total per method), check-ins and check-outs, cleaning tasks, maintenance issues and pending items. Pending is computed, not stored: cleaning tasks still `pending`, issues not `resolved`, and unverified payments.
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No active shift
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /shifts/current/handover:
    patch:
      tags: [Shifts]
      operationId: handoverShift
      summary: Add notes and close the shift
      description: |
        Sets `status=handed_over` and `handed_over_at` (server time, which may differ from the scheduled end). After handover:
        - The session can no longer write anything: any POST or PATCH returns `409 SHIFT_CLOSED`.
        - Payments recorded in that shift are never editable.
        - Open tasks and issues can still be updated by the next shift; those updates are logged under the next shift.
        - The PDF report is generated once, at handover, and stored as a fixed copy. Reopening a shift is a Manager system action.
        This is allowed even after the scheduled end, as long as the shift is still `active`. Attendance check-out is recorded at this moment.
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoverRequest'
            example:
              shift_notes: Room 205 AC still broken, guest in 101 will pay the rest tomorrow.
      responses:
        '200':
          description: Shift closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /shifts/{shift_id}/report:
    get:
      tags: [Shifts]
      operationId: getShiftReport
      summary: Download the stored shift report (PDF)
      description: |
        Returns the PDF that was generated at handover. Only the receptionist's own shifts are available; another shift returns 404. The report contains the receptionist's data, the shift time, rooms, cleaning, maintenance, payments and notes.
      parameters:
        - $ref: '#/components/parameters/ShiftId'
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TestTimeHeader'
      responses:
        '200':
          description: PDF report
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 15-minute access token from `/auth/login` or `/auth/refresh`, role `receptionist`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: '`httpOnly`, `Secure`, `SameSite=Strict` cookie set by the server. The frontend never reads it.'
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A random UUID generated by the frontend for each user action. Reusing it with the same body returns the original response.
      schema:
        type: string
        format: uuid
      example: 3f2b8c5e-7d1a-4c0e-9b6a-2e8f4d1c7a90
    AuthorizationHeader:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    TestTimeHeader:
      name: x-test-time
      in: header
      required: false
      schema:
        type: string
    RoomId:
      name: room_id
      in: path
      required: true
      schema:
        type: string
    GuestId:
      name: guest_id
      in: path
      required: true
      schema:
        type: string
    ReservationId:
      name: reservation_id
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    IssueId:
      name: issue_id
      in: path
      required: true
      schema:
        type: string
    ShiftId:
      name: shift_id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid body or query (also a payment amount that is zero, negative or above the remaining amount)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: amount must be greater than 0 and not more than the remaining amount (3000.00).
    Unauthorized:
      description: Missing or expired token, or wrong credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Invalid credentials.
    Forbidden:
      description: |
        Not allowed. Also returned for any write in a read-only session (before the shift starts), and when the role is not `receptionist`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: This session is read-only until your shift starts.
    NotFound:
      description: Resource does not exist (or belongs to another shift's private data)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Reservation not found.
    Conflict:
      description: |
        The request conflicts with the current state. Possible codes:
        `CONFLICT` (double booking, extension blocked by another booking, early arrival when the room is not free, reducing nights below the amount already paid, duplicate guest, cancel after check-in),
        `INVALID_STATUS_TRANSITION` (room status change not allowed),
        `PAYMENT_REQUIRED` (check-in without any payment),
        `BALANCE_DUE` (check-out while an unpaid balance remains),
        `AMBIGUOUS_RESERVATION` (payment by room matches more than one reservation),
        `SHIFT_CLOSED` (shift already handed over),
        `SHIFT_HANDOVER_ONLY` (the next shift has started; this session can only hand over).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            payment_required:
              value:
                error:
                  code: PAYMENT_REQUIRED
                  message: Record at least one payment before check-in.
            balance_due:
              value:
                error:
                  code: BALANCE_DUE
                  message: 'Check-out is blocked: 500.00 EGP remaining.'
            invalid_transition:
              value:
                error:
                  code: INVALID_STATUS_TRANSITION
                  message: A room in 'occupied' status cannot be changed manually.
            shift_closed:
              value:
                error:
                  code: SHIFT_CLOSED
                  message: This shift was already handed over.
    TooManyRequests:
      description: Rate limit or account lockout
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: TOO_MANY_REQUESTS
              message: Too many attempts. Try again in 15 minutes.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - OUTSIDE_SHIFT_HOURS
        - NOT_SCHEDULED
        - NOT_FOUND
        - CONFLICT
        - INVALID_STATUS_TRANSITION
        - PAYMENT_REQUIRED
        - BALANCE_DUE
        - AMBIGUOUS_RESERVATION
        - SHIFT_CLOSED
        - SHIFT_HANDOVER_ONLY
        - TOO_MANY_REQUESTS
        - BAD_REQUEST
        - RECORD_ALREADY_DECIDED
        - CANNOT_APPROVE_OWN_REQUEST
    ApprovalRequest:
      type: object
      required: [approval_id, booking_id, request_type, status, reason, requested_refund_amount, net_paid_amount, approved_refund_amount, retained_amount]
      properties:
        approval_id:
          type: string
        booking_id:
          type: string
          nullable: true
        request_type:
          type: string
          enum: [REFUND, DISCOUNT, CANCELLATION, UPGRADE, PRICE_OVERRIDE]
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, CANCELLED]
        requested_by_staff_id:
          type: string
          nullable: true
        requested_by_name:
          type: string
          nullable: true
        reason:
          type: string
        requested_refund_amount:
          $ref: '#/components/schemas/Money'
        net_paid_amount:
          $ref: '#/components/schemas/Money'
        approved_refund_amount:
          $ref: '#/components/schemas/Money'
        retained_amount:
          $ref: '#/components/schemas/Money'
        manager_comment:
          type: string
          nullable: true
        decided_by_staff_id:
          type: string
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        reservation:
          type: object
          nullable: true
    Meta:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 134
    Money:
      type: number
      format: double
      description: Amount in Egyptian pounds (EGP), two decimal digits.
      example: 1500.00
    Priority:
      type: string
      enum: [low, medium, high, urgent]
    RoomStatus:
      type: string
      enum: [available, reserved, occupied, cleaning, maintenance, out_of_service]
    ReservationStatus:
      type: string
      enum: [confirmed, checked_in, checked_out, cancelled]
      description: A reservation is `confirmed` from the moment it is created.
    CleaningTaskStatus:
      type: string
      enum: [pending, done]
      description: '`pending` means not started.'
    MaintenanceIssueStatus:
      type: string
      enum: [open, in_progress, resolved]
    PaymentMethod:
      type: string
      enum: [cash, instapay, vodafone_cash]
    ShiftType:
      type: string
      enum: [morning, evening, night]
      description: morning 07:00-16:00, evening 16:00-23:00, night 23:00-07:00 (Cairo time).
    ShiftStatus:
      type: string
      enum: [active, handed_over]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 100
        password:
          type: string
          format: password
          maxLength: 200
    Staff:
      type: object
      required: [staff_id, name]
      properties:
        staff_id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [receptionist, manager, admin]
        default_shift_type:
          type: string
          enum: [morning, evening, night, null]
          nullable: true
        staff_type:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
    Shift:
      type: object
      required: [shift_id, staff_id, shift_date, shift_type, start_time, end_time, status]
      properties:
        shift_id:
          type: string
        staff_id:
          type: string
        shift_date:
          type: string
          format: date
          description: The date the shift started (Cairo). A night shift keeps the date it started.
        shift_type:
          $ref: '#/components/schemas/ShiftType'
        start_time:
          type: string
          description: Scheduled start, `HH:MM` Cairo time.
          example: '07:00'
        end_time:
          type: string
          description: Scheduled end, `HH:MM` Cairo time. For a night shift it is on the next day.
          example: '16:00'
        status:
          $ref: '#/components/schemas/ShiftStatus'
        handed_over_at:
          type: string
          format: date-time
          nullable: true
          description: Actual handover time (server time). May differ from the scheduled end.
        shift_notes:
          type: string
          nullable: true
    NullableShift:
      type: object
      nullable: true
      required: [shift_id, staff_id, shift_date, shift_type, start_time, end_time, status]
      properties:
        shift_id:
          type: string
        staff_id:
          type: string
        shift_date:
          type: string
          format: date
          description: The date the shift started (Cairo). A night shift keeps the date it started.
        shift_type:
          $ref: '#/components/schemas/ShiftType'
        start_time:
          type: string
          description: Scheduled start, `HH:MM` Cairo time.
          example: '07:00'
        end_time:
          type: string
          description: Scheduled end, `HH:MM` Cairo time. For a night shift it is on the next day.
          example: '16:00'
        status:
          $ref: '#/components/schemas/ShiftStatus'
        handed_over_at:
          type: string
          format: date-time
          nullable: true
          description: Actual handover time (server time). May differ from the scheduled end.
        shift_notes:
          type: string
          nullable: true
    LoginResponse:
      type: object
      required: [access_token, expires_in, staff, shift, read_only]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          description: Seconds until the access token expires (900).
          example: 900
        staff:
          $ref: '#/components/schemas/Staff'
        shift:
          $ref: '#/components/schemas/NullableShift'
          description: '`null` while the session is read-only (before the scheduled start).'
        read_only:
          type: boolean
          description: True before the shift starts. Every write returns 403 while it is true.
    Me:
      type: object
      required: [staff, shift, read_only]
      properties:
        staff:
          $ref: '#/components/schemas/Staff'
        shift:
          $ref: '#/components/schemas/NullableShift'
        read_only:
          type: boolean
        open_business_day:
          type: object
          nullable: true
          properties:
            business_date:
              type: string
            status:
              type: string
            opened_at:
              type: string
              format: date-time
    PaymentTotals:
      type: object
      required: [cash, instapay, vodafone_cash, total]
      properties:
        cash:
          $ref: '#/components/schemas/Money'
        instapay:
          $ref: '#/components/schemas/Money'
        vodafone_cash:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
    Dashboard:
      type: object
      required: [total_rooms, rooms_by_status, rooms_needing_cleaning, open_maintenance_issues, shift_payments_total]
      properties:
        total_rooms:
          type: integer
          example: 60
        rooms_by_status:
          type: object
          additionalProperties:
            type: integer
          example:
            available: 30
            reserved: 6
            occupied: 18
            cleaning: 4
            maintenance: 2
        rooms_needing_cleaning:
          type: integer
          example: 4
        open_maintenance_issues:
          type: integer
          example: 3
        shift_payments_total:
          $ref: '#/components/schemas/PaymentTotals'
    Room:
      type: object
      required: [room_id, room_number, room_type, status, description, price_per_night, half_day_price]
      properties:
        room_id:
          type: string
          example: '6acdc9c681d42a01709fcb7a'
        room_number:
          type: string
          example: '101'
        floor:
          type: integer
          nullable: true
          example: 1
        room_type:
          type: string
          example: double
        status:
          $ref: '#/components/schemas/RoomStatus'
        description:
          type: string
          example: Sea view
        price_per_night:
          $ref: '#/components/schemas/Money'
        half_day_price:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Price of a half-day extension after check-out, or of an early arrival before 12:00.
        current_guest_name:
          type: string
          nullable: true
          description: Name of the checked-in guest. Filled only when the room is occupied.
        view:
          type: string
          nullable: true
          enum: [nile, garden, city, null]
          description: Room view. Null when not set.     
        updated_at:
          type: string
          format: date-time
          nullable: true
    RoomStatusChange:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [available, cleaning, maintenance]
        notes:
          type: string
          maxLength: 500
    RoomStatusHistory:
      type: object
      required: [history_id, room_id, status, changed_at, shift_id]
      properties:
        history_id:
          type: string
        room_id:
          type: string
        status:
          $ref: '#/components/schemas/RoomStatus'
        notes:
          type: string
          nullable: true
        changed_at:
          type: string
          format: date-time
        shift_id:
          type: string
          nullable: true
    GuestCreate:
      type: object
      required: [name, phone, id_number]
      properties:
        name:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 30
        id_number:
          type: string
          maxLength: 50
          description: National ID or passport number. Stored encrypted.
    Guest:
      type: object
      required: [guest_id, name, phone, id_number]
      properties:
        guest_id:
          type: string
          example: '6acdc9c681d42a01709fcb7a'
        name:
          type: string
        phone:
          type: string
        id_number:
          type: string
          description: Masked; only the last 4 characters are shown.
          example: '**********4567'
    ReservationCreate:
      type: object
      required: [guest_id, room_id, check_in, check_out]
      properties:
        guest_id:
          type: string
        room_id:
          type: string
        check_in:
          type: string
          format: date-time
          description: Standard time is 12:00 Cairo time.
        check_out:
          type: string
          format: date-time
          description: Standard time is 12:00 Cairo time. Must be after check_in.
    ReservationUpdate:
      type: object
      minProperties: 1
      properties:
        room_id:
          type: string
        check_in:
          type: string
          format: date-time
        check_out:
          type: string
          format: date-time
    CheckInRequest:
      type: object
      properties:
        early_arrival:
          type: boolean
          default: false
          description: Send true when the guest arrives before 12:00 and the room is free. Adds one half-day price.
    Reservation:
      type: object
      required: [reservation_id, guest_id, room_id, check_in, check_out, status, half_day_extensions, early_arrival, total_amount, paid_amount, remaining_amount]
      properties:
        reservation_id:
          type: string
        guest_id:
          type: string
        room_id:
          type: string
        check_in:
          type: string
          format: date-time
        check_out:
          type: string
          format: date-time
        reservation_date:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ReservationStatus'
        half_day_extensions:
          type: integer
          minimum: 0
          description: Number of half-day extensions added after the 12:00 check-out time.
        early_arrival:
          type: boolean
          description: True when the early-arrival half-day fee was charged.
        total_amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Total price, calculated by the server (nights x price per night, plus half-day fees).
        paid_amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Sum of the payments recorded for this reservation.
        remaining_amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: total_amount minus paid_amount.
        refund_pending:
          type: boolean
          description: Only on a cancelled reservation that has payments. The manager handles the refund.
        check_in_staff_id:
          type: string
          nullable: true
        check_in_shift_id:
          type: string
          nullable: true
        check_out_staff_id:
          type: string
          nullable: true
        check_out_shift_id:
          type: string
          nullable: true
      example:
        reservation_id: '55'
        guest_id: '7'
        room_id: '101'
        check_in: '2026-10-10T12:00:00+03:00'
        check_out: '2026-10-13T12:00:00+03:00'
        reservation_date: '2026-10-08T14:30:00+03:00'
        status: confirmed
        half_day_extensions: 0
        early_arrival: false
        total_amount: 4500.00
        paid_amount: 1500.00
        remaining_amount: 3000.00
        check_in_staff_id: null
        check_in_shift_id: null
        check_out_staff_id: null
        check_out_shift_id: null
    ReservationDetail:
      allOf:
        - $ref: '#/components/schemas/Reservation'
        - type: object
          properties:
            guest:
              $ref: '#/components/schemas/Guest'
            room:
              $ref: '#/components/schemas/Room'
            payments:
              type: array
              items:
                $ref: '#/components/schemas/Payment'
    PaymentCreate:
      type: object
      required: [amount, payment_method]
      anyOf:
        - required: [reservation_id]
        - required: [room_id]
      properties:
        reservation_id:
          type: string
          description: Preferred. Picked from a search by guest name, phone or room.
        room_id:
          type: string
          description: Used only when `reservation_id` is not sent.
        amount:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          description: Greater than 0 and less than or equal to the current remaining amount.
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        notes:
          type: string
          maxLength: 500
    Payment:
      type: object
      required: [payment_id, reservation_id, staff_id, shift_id, amount, payment_method, payment_datetime, payment_verified]
      properties:
        payment_id:
          type: string
        reservation_id:
          type: string
        staff_id:
          type: string
        shift_id:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        notes:
          type: string
          nullable: true
        payment_datetime:
          type: string
          format: date-time
        payment_verified:
          type: boolean
          description: Set to true only from the Manager system.
        reversal_of_payment_id:
          type: string
          nullable: true
          description: Set on a correction record created by the manager.
    PaymentResult:
      type: object
      required: [payment, paid_amount, remaining_amount]
      properties:
        payment:
          $ref: '#/components/schemas/Payment'
        paid_amount:
          $ref: '#/components/schemas/Money'
        remaining_amount:
          $ref: '#/components/schemas/Money'
    CleaningTaskCreate:
      type: object
      required: [room_id, priority]
      properties:
        room_id:
          type: string
        cleaner_name:
          type: string
          maxLength: 200
          description: Free text. Can be set later.
        priority:
          $ref: '#/components/schemas/Priority'
        notes:
          type: string
          maxLength: 500
    CleaningTaskUpdate:
      type: object
      minProperties: 1
      properties:
        cleaner_name:
          type: string
          maxLength: 200
        priority:
          $ref: '#/components/schemas/Priority'
        notes:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [done]
          description: The only change the receptionist can make to the status is `pending` to `done`.
    CleaningTask:
      type: object
      required: [task_id, room_id, priority, status, assigned_date, shift_id]
      properties:
        task_id:
          type: string
        room_id:
          type: string
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/CleaningTaskStatus'
        notes:
          type: string
          nullable: true
        cleaner_name:
          type: string
          nullable: true
          description: Null until the receptionist assigns a cleaner.
        assigned_date:
          type: string
          format: date-time
        finished_date:
          type: string
          format: date-time
          nullable: true
        shift_id:
          type: string
          nullable: true
          description: The shift in which the task was created.
        assigned_by_staff_id:
          type: string
          nullable: true
          description: The receptionist who assigned the cleaner.
    MaintenanceIssueCreate:
      type: object
      required: [room_id, problem, priority]
      properties:
        room_id:
          type: string
        problem:
          type: string
          maxLength: 300
        priority:
          $ref: '#/components/schemas/Priority'
        notes:
          type: string
          maxLength: 500
    MaintenanceIssueUpdate:
      type: object
      minProperties: 1
      properties:
        priority:
          $ref: '#/components/schemas/Priority'
        notes:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [in_progress, resolved]
    MaintenanceIssue:
      type: object
      required: [issue_id, room_id, problem, priority, status, created_date, shift_id, staff_id]
      properties:
        issue_id:
          type: string
        room_id:
          type: string
        problem:
          type: string
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/MaintenanceIssueStatus'
        notes:
          type: string
          nullable: true
        created_date:
          type: string
          format: date-time
        resolved_date:
          type: string
          format: date-time
          nullable: true
        shift_id:
          type: string
          description: The shift in which the issue was reported.
        staff_id:
          type: string
          description: The receptionist who reported it.
    HandoverRequest:
      type: object
      properties:
        shift_notes:
          type: string
          maxLength: 2000
    ShiftSummary:
      type: object
      required: [shift, payments, check_ins, check_outs, rooms_handled, cleaning_tasks, maintenance_issues, pending]
      properties:
        shift:
          $ref: '#/components/schemas/Shift'
        payments:
          $ref: '#/components/schemas/PaymentTotals'
        check_ins:
          type: integer
          example: 6
        check_outs:
          type: integer
          example: 5
        rooms_handled:
          type: array
          description: Room ids the receptionist worked on in this shift.
          items:
            type: string
        cleaning_tasks:
          type: array
          description: Cleaning tasks created in this shift.
          items:
            $ref: '#/components/schemas/CleaningTask'
        maintenance_issues:
          type: array
          description: Maintenance issues reported in this shift.
          items:
            $ref: '#/components/schemas/MaintenanceIssue'
        pending:
          type: object
          description: Everything still unfinished, including items from earlier shifts.
          required: [cleaning_tasks, maintenance_issues, unverified_payments]
          properties:
            cleaning_tasks:
              type: array
              items:
                $ref: '#/components/schemas/CleaningTask'
            maintenance_issues:
              type: array
              items:
                $ref: '#/components/schemas/MaintenanceIssue'
            unverified_payments:
              type: array
              items:
                $ref: '#/components/schemas/Payment'
